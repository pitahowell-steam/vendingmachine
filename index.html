<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Portfolio Vending Machine</title>
    <style>
        :root {
            --frame: #1e1e1e;
            --accent: #d32f2f;
            --led: #3dfc03;
            --metal: linear-gradient(145deg, #333, #111);
        }

        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Courier New', monospace;
        }

        /* Machine Chassis */
        .vending-box {
            width: 400px;
            background: var(--frame);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
            border: 4px solid #333;
        }

        /* Glass Viewport */
        .glass {
            background: #000;
            height: 400px;
            border: 10px solid #111;
            border-radius: 5px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,255,0,0.02);
        }

        /* Items */
        .product {
            background: #fff;
            height: 110px;
            display: flex;
            flex-direction: column;
            border-bottom: 5px solid #bbb;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .product img { width: 100%; height: 80px; object-fit: cover; }
        .code-tag { background: #333; color: white; text-align: center; font-size: 12px; padding: 2px; }

        /* Panel */
        .panel {
            margin-top: 25px;
            display: flex;
            gap: 20px;
            background: #222;
            padding: 15px;
            border-radius: 10px;
        }

        #screen {
            background: #050505;
            color: var(--led);
            padding: 10px;
            flex-grow: 1;
            text-align: right;
            border: 2px solid #333;
            text-shadow: 0 0 5px var(--led);
        }

        .grid-keys {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .key {
            background: #333;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-bottom: 3px solid #000;
        }

        .key:active { border-bottom: 0; transform: translateY(3px); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            justify-content: center; align-items: center;
            z-index: 99;
        }

        .modal-content {
            background: #1a1a1a;
            color: white;
            padding: 30px;
            border: 1px solid var(--led);
            max-width: 500px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="vending-box">
    <div class="glass">
        <div class="product"><img src="https://via.placeholder.com/150/0000FF"><div class="code-tag">A1</div></div>
        <div class="product"><img src="https://via.placeholder.com/150/FF0000"><div class="code-tag">A2</div></div>
        <div class="product"><img src="https://via.placeholder.com/150/00FF00"><div class="code-tag">B1</div></div>
        <div class="product"><img src="https://via.placeholder.com/150/FFFF00"><div class="code-tag">B2</div></div>
    </div>

    <div class="panel">
        <div id="screen">IDLE</div>
        <div class="grid-keys">
            <button class="key" onclick="press('A')">A</button>
            <button class="key" onclick="press('B')">B</button>
            <button class="key" onclick="press('1')">1</button>
            <button class="key" onclick="press('2')">2</button>
            <button class="key" onclick="clearS()">C</button>
            <button class="key" onclick="vend()" style="background: #060;">E</button>
        </div>
    </div>
</div>

<div id="modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="mTitle"></h2>
        <img id="mImg" style="width:100%">
        <p id="mDesc"></p>
        <button onclick="document.getElementById('modal').style.display='none'">CLOSE</button>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let input = "";
    
    const projects = {
        "A1": { name: "3D Character", desc: "A detailed 3D sculpt.", img: "https://via.placeholder.com/500x300/0000FF" },
        "A2": { name: "Environment Art", desc: "Unreal Engine 5 scene.", img: "https://via.placeholder.com/500x300/FF0000" }
    };

    function playSound(freq, type, duration) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function press(val) {
        playSound(800, 'square', 0.1); // Key beep
        if(input.length < 2) {
            input += val;
            document.getElementById('screen').innerText = input;
        }
    }

    function clearS() {
        input = "";
        document.getElementById('screen').innerText = "IDLE";
        playSound(300, 'sine', 0.2);
    }

    function vend() {
        if(projects[input]) {
            document.getElementById('screen').innerText = "VENDING";
            // Mechanical motor sound
            playSound(100, 'sawtooth', 0.8);
            setTimeout(() => {
                const p = projects[input];
                document.getElementById('mTitle').innerText = p.name;
                document.getElementById('mImg').src = p.img;
                document.getElementById('mDesc').innerText = p.desc;
                document.getElementById('modal').style.display = 'flex';
                clearS();
            }, 1000);
        } else {
            document.getElementById('screen').innerText = "ERROR";
            playSound(150, 'square', 0.5);
            setTimeout(clearS, 1000);
        }
    }
</script>
</body>
</html>
