<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Portfolio Vending Machine</title>
    <style>
        :root {
            --machine-red: #d32f2f;
            --glass-blue: rgba(173, 216, 230, 0.3);
            --metal-grey: #444;
        }

        body {
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
        }

        /* The Vending Machine Frame */
        .vending-machine {
            width: 350px;
            background: var(--machine-red);
            border: 10px solid #8b0000;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Glass Display Area */
        .display-glass {
            background: var(--glass-blue);
            border: 5px solid var(--metal-grey);
            height: 450px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 15px;
            overflow-y: auto;
        }

        /* Project Items (The "Snacks") */
        .item {
            background: white;
            height: 100px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: black;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            border-bottom: 4px solid #ccc;
        }

        .item:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .item img {
            width: 80%;
            height: 60px;
            object-fit: cover;
            margin-bottom: 5px;
        }

        /* Interaction Panel */
        .controls {
            margin-top: 20px;
            background: #222;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-top: 10px;
        }

        .key {
            background: #444;
            border: 1px solid #666;
            color: white;
            padding: 5px;
            border-radius: 3px;
        }

        /* Pop-up Modal (The "Closer Look") */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #333;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            text-align: center;
        }

        .modal-content img {
            max-width: 100%;
            border-radius: 10px;
        }

        .btn-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: var(--machine-red);
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="vending-machine">
    <div class="display-glass" id="machine-items">
        <div class="item" onclick="openProject('Cyberpunk Car', 'A high-poly 3D model of a futuristic vehicle.', 'https://via.placeholder.com/400x300', 'project1.html')">
            <img src="https://via.placeholder.com/80" alt="P1">
            <span>A1</span>
        </div>
        <div class="item" onclick="openProject('Nature Landscape', 'Matte painting using Photoshop and Maya.', 'https://via.placeholder.com/400x300', 'project2.html')">
            <img src="https://via.placeholder.com/80" alt="P2">
            <span>A2</span>
        </div>
        </div>

    <div class="controls">
        <div style="color: #0f0; font-family: monospace; background: #000; padding: 5px;">SELECT ITEM...</div>
        <div class="keypad">
            <div class="key">1</div><div class="key">2</div><div class="key">3</div>
            <div class="key">A</div><div class="key">B</div><div class="key">C</div>
        </div>
    </div>
</div>

<div id="projectModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Project Title</h2>
        <img id="modalImg" src="" alt="Project Preview">
        <p id="modalDesc">Description goes here.</p>
        <a id="modalLink" href="#" class="btn-link">View Full Project Details</a>
        <br><br>
        <button onclick="closeModal()" style="background:none; border:none; color:grey; cursor:pointer;">[ Close ]</button>
    </div>
</div>

<script>
    function openProject(title, desc, img, link) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalDesc').innerText = desc;
        document.getElementById('modalImg').src = img;
        document.getElementById('modalLink').href = link;
        document.getElementById('projectModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('projectModal').style.display = 'none';
    }

    // Close modal if user clicks outside of the box
    window.onclick = function(event) {
        if (event.target == document.getElementById('projectModal')) {
            closeModal();
        }
    }
</script>

</body>
</html>
