<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Artist Portfolio Vending Machine</title>
    <style>
        :root {
            --machine-red: #be1e2d;
            --glass-blue: rgba(173, 216, 230, 0.2);
            --display-green: #3dfc03;
        }

        body {
            background-color: #121212;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
        }

        .vending-machine {
            width: 380px;
            background: var(--machine-red);
            border: 12px solid #801010;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
        }

        /* Glass Front */
        .display-glass {
            background: var(--glass-blue);
            border: 6px solid #333;
            height: 400px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
            position: relative;
            box-shadow: inset 0 0 50px rgba(255,255,255,0.1);
        }

        .item {
            background: #fff;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            color: #333;
            font-weight: bold;
            transition: transform 0.3s ease;
        }

        .item img { width: 100%; height: 70px; object-fit: cover; }

        /* The Interactive Panel */
        .controls {
            margin-top: 25px;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 15px;
            border: 4px solid #1a1a1a;
        }

        #digital-screen {
            background: #000;
            color: var(--display-green);
            padding: 10px;
            text-align: right;
            font-size: 1.5rem;
            border-radius: 5px;
            margin-bottom: 15px;
            border: 2px solid #444;
            min-height: 30px;
            text-shadow: 0 0 5px var(--display-green);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .key {
            background: #444;
            border: none;
            color: white;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px #222;
        }

        .key:active {
            box-shadow: 0 0 #222;
            transform: translateY(4px);
        }

        /* Modal / Detail View */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #222;
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            border: 2px solid var(--machine-red);
        }

        .modal-content img { width: 100%; border-radius: 10px; margin-bottom: 20px; }

        .btn {
            background: var(--machine-red);
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="vending-machine">
    <div class="display-glass">
        <div class="item">
            <img src="https://via.placeholder.com/150/0000FF/FFFFFF?text=Project+A1" alt="A1">
            <div>A1</div>
        </div>
        <div class="item">
            <img src="https://via.placeholder.com/150/FF0000/FFFFFF?text=Project+A2" alt="A2">
            <div>A2</div>
        </div>
        </div>

    <div class="controls">
        <div id="digital-screen">_</div>
        <div class="keypad">
            <button class="key" onclick="press('A')">A</button>
            <button class="key" onclick="press('B')">B</button>
            <button class="key" onclick="press('C')">C</button>
            <button class="key" onclick="press('1')">1</button>
            <button class="key" onclick="press('2')">2</button>
            <button class="key" onclick="press('3')">3</button>
            <button class="key" onclick="clearScreen()" style="background:#888">CLR</button>
            <button class="key" onclick="press('0')">0</button>
            <button class="key" onclick="enterCode()" style="background:#060">ENT</button>
        </div>
    </div>
</div>

<div id="projectModal" class="modal">
    <div class="modal-content">
        <h1 id="mTitle">Project</h1>
        <img id="mImg" src="" alt="Work">
        <p id="mDesc"></p>
        <a href="#" id="mLink" class="btn">Launch Case Study</a>
        <br><br>
        <button onclick="closeModal()" style="color: #888; background: none; border: none; cursor: pointer;">[ Close ]</button>
    </div>
</div>

<script>
    let currentInput = "";
    const screen = document.getElementById('digital-screen');

    // Project Data Dictionary
    const projects = {
        "A1": { title: "Nebula Engine", desc: "A custom 3D render engine built in C++.", img: "https://via.placeholder.com/500x300/0000FF", link: "a1.html" },
        "A2": { title: "Viking Axe", desc: "High-poly sculpt using ZBrush and Substance Painter.", img: "https://via.placeholder.com/500x300/FF0000", link: "a2.html" }
    };

    function press(val) {
        if(currentInput.length < 2) {
            currentInput += val;
            screen.innerText = currentInput;
        }
    }

    function clearScreen() {
        currentInput = "";
        screen.innerText = "_";
    }

    function enterCode() {
        const project = projects[currentInput];
        if (project) {
            screen.innerText = "VENDING...";
            setTimeout(() => {
                showModal(project);
                clearScreen();
            }, 800);
        } else {
            screen.innerText = "ERR";
            setTimeout(clearScreen, 1000);
        }
    }

    function showModal(data) {
        document.getElementById('mTitle').innerText = data.title;
        document.getElementById('mDesc').innerText = data.desc;
        document.getElementById('mImg').src = data.img;
        document.getElementById('mLink').href = data.link;
        document.getElementById('projectModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('projectModal').style.display = 'none';
    }
</script>

</body>
</html>
